<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Portafolio de Ana</title>
  <style>
    body {
      background-color: #010e26;
      font-family: Arial, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box-registro {
      border: 1px solid white;
      padding: 30px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    .campo {
      margin-bottom: 15px;
      text-align: left;
    }

    .campo label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .campo input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      box-sizing: border-box;
    }

    .btn-registrar {
      padding: 10px 20px;
      color: #ffffff;
      background: transparent;
      border: 2px solid #a855f7;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }

    .error-mensaje {
      color: #ff4d4d;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box-registro">
    <h2>Registro</h2>
    <form id="form-registro">
      <div class="campo">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" class="btn-registrar">Registrarse</button>
      <p id="error" class="error-mensaje">Contraseña incorrecta</p>
    </form>
  </div>

  <script>
    const formulario = document.getElementById('form-registro');
    const inputPass = document.getElementById('password');
    const errorMsg = document.getElementById('error');

    formulario.addEventListener('submit', function(event) {
      // Evita que la página se recargue de golpe
      event.preventDefault(); 

      // Verificamos si la contraseña coincide
      if (inputPass.value === 'anamaria11') {
        // Redirige a la nueva página (Menú)
        window.location.href = 'menu.html'; 
      } else {
        // Muestra el mensaje de error si no es correcta
        errorMsg.style.display = 'block';
      }
    });
  </script>

<script src="mariposas.js"></script>
</body>
</html>
